[project]
name = "puffin-eda"
version = "0.1.0"
description = "Engineer-first, AI-ready schematic, PCB, and firmware IDE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
puffin = "puffin.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "playwright==1.65.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["puffin"]

[tool.hatch.build.targets.wheel.force-include]
"parts" = "puffin/_bundled_parts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["puffin/core", "puffin/generators", "puffin/kicad", "puffin/mcp", "puffin/web"]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true
