  N16R8: {extra_flags: {GPIO35: [octal_psram], GPIO36: [octal_psram], GPIO37: [octal_psram]}}
  N16R16VA7: {extra_flags: {GPIO35: [octal_psram], GPIO36: [octal_psram], GPIO37: [octal_psram], GPIO47: [vdd_spi_1v8], GPIO48: [vdd_spi_1v8]}}
