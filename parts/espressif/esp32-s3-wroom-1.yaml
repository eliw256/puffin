peripherals:  # routing: series datasheet Section 2.3.5, Table 2-9 and its note 2
  gpio: {signals: [io], routable: gpio_matrix}
  spi2: {signals: [sck, mosi, miso, cs, hd, wp], routable: gpio_matrix}
  spi3: {signals: [sck, mosi, miso, cs, hd, wp], routable: gpio_matrix}
  # Directions: series datasheet v2.2, Table 2-4 IO MUX Functions types
  # (U0TXD, U1TXD, U0RTS, U1RTS: O; U0RXD, U1RXD, U0CTS, U1CTS: I).
  uart0: {signals: {tx: out, rx: in, rts: out, cts: in}, routable: gpio_matrix}
  uart1: {signals: {tx: out, rx: in, rts: out, cts: in}, routable: gpio_matrix}
  uart2: {signals: [tx, rx, rts, cts], routable: gpio_matrix}
  i2c0: {signals: [sda, scl], routable: gpio_matrix}
  i2c1: {signals: [sda, scl], routable: gpio_matrix}
  adc1: {signals: [ch0, ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8, ch9], routable: fixed}
  adc2: {signals: [ch0, ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8, ch9], routable: fixed}
  usb_serial_jtag: {signals: [dm, dp], routable: fixed}
  jtag: {signals: [tck, tdo, tdi, tms], routable: fixed}
flag_policy:
  strapping: {description: "sampled at reset; controls boot configuration (module datasheet Section 4)"}
  usb: {description: "defaults to USB Serial/JTAG (series datasheet Section 2.3.4)", exempt_peripherals: [usb_serial_jtag]}
  jtag: {description: "JTAG interface, often used for debugging (series datasheet Section 2.3.4)", exempt_peripherals: [jtag]}
  uart0_console: {description: "UART0 interface, often used for debugging (series datasheet Section 2.3.4)", exempt_peripherals: [uart0]}
  octal_psram: {description: "connected to Octal SPI PSRAM on this variant (module datasheet Table 3-1 note b)"}
  vdd_spi_1v8: {description: "operates at 1.8 V on this variant (module datasheet Table 3-1 note c)"}
variants:
  N4: {}
  N8: {}
  N16: {}
  H4: {}
  N4R2: {}
  N8R2: {}
  N16R2: {}
  N4R8: {extra_flags: {GPIO35: [octal_psram], GPIO36: [octal_psram], GPIO37: [octal_psram]}}
  N8R8: {extra_flags: {GPIO35: [octal_psram], GPIO36: [octal_psram], GPIO37: [octal_psram]}}
  N16R8: {extra_flags: {GPIO35: [octal_psram], GPIO36: [octal_psram], GPIO37: [octal_psram]}}
  N16R16VA7: {extra_flags: {GPIO35: [octal_psram], GPIO36: [octal_psram], GPIO37: [octal_psram], GPIO47: [vdd_spi_1v8], GPIO48: [vdd_spi_1v8]}}
timing: {}  # TODO(verify): add SPI timing from the Technical Reference Manual
